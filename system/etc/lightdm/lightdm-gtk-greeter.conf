# Référence (NON gérée par stow) — fichier système.
# Installation manuelle :
#   sudo install -Dm644 ~/.wallpaper.png /usr/share/backgrounds/i3-wallpaper.png
#   sudo cp system/etc/lightdm/lightdm-gtk-greeter.conf /etc/lightdm/lightdm-gtk-greeter.conf
#
# Thème assorti au bureau Sway/i3 (Adwaita-dark + Papirus-Dark), même fond d'écran,
# et sélecteur de session (~session) pour choisir Sway / i3 au login.
[greeter]
background=/usr/share/backgrounds/i3-wallpaper.png
user-background=false
theme-name=Adwaita-dark
icon-theme-name=Papirus-Dark
cursor-theme-name=Adwaita
font-name=MesloLGS Nerd Font 11
xft-antialias=true
xft-hintstyle=slight
xft-rgba=rgb
position=50% 50%
round-user-image=true
highlight-logged-user=true
indicators=~session;~spacer;~clock;~spacer;~language;~power
clock-format=%H:%M   ·   %A %d %B
