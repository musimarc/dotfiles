# ===== Terminal =====
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"   # truecolor

# use zsh as the default shell inside tmux
set -g default-shell /usr/bin/zsh
set -g default-command /usr/bin/zsh

# ===== Prefix : C-a =====
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# ===== Splits (s'ouvrent dans le dossier courant du pane) =====
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# ===== Fenêtres / panes =====
set -g base-index 1                  # numérotation à partir de 1
setw -g pane-base-index 1
set-option -g renumber-windows on    # renumérote les fenêtres à la fermeture

# ===== Reload config =====
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# ===== Resize panes =====
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5
bind -r m resize-pane -Z             # zoom toggle

# ===== Souris & copy-mode (vi) =====
set -g mouse on
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection   # commencer la sélection avec v
bind-key -T copy-mode-vi 'y' send -X copy-selection    # copier avec y
unbind -T copy-mode-vi MouseDragEnd1Pane               # ne pas quitter le copy-mode au drag souris

# ===== Neovim / divers =====
set -sg escape-time 10               # pas de délai sur ESC (neovim)
set-option -g focus-events on        # événements de focus (neovim autoread...)
set-option -g allow-passthrough on   # affichage d'images dans tmux

# ===== Plugins (tpm) =====
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'  # navigation vim <-> tmux
set -g @plugin 'tmux-plugins/tmux-resurrect'     # persiste les sessions après redémarrage
set -g @plugin 'tmux-plugins/tmux-continuum'     # sauvegarde auto toutes les 15 min
set -g @plugin 'fabioluciano/tmux-tokyo-night'   # thème (conservé)

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
